# Serves the built app, and forwards /api to the API container, the same way Vercel does in
# production. So the front end always calls /api/... on its own address.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
