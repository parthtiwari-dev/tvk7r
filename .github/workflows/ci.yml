# Runs on every push and pull request: both test suites, the front-end build, and a check
# that the Docker setup starts and answers.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker compose starts and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: The API answers through nginx
        run: curl --fail --silent http://localhost:8080/api/health
      - name: One day loads through nginx
        run: curl --fail --silent --output /dev/null http://localhost:8080/api/day/2026-01-15
      - name: The app page loads
        run: curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
